<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android版 app/src/main/res/drawable/ic_launcher_foreground.xml と同じ意匠。
  WebView (ブラウザウィンドウ) と JS <-> Native の双方向 (⇄) を表す。
  背景はアプリと WebView コンテンツで共通のティール (web/app/theme.ts の primary)。

  Androidのアダプティブアイコンと違いセーフゾーンの縮小が不要なため、
  作画をアイコン中心 (54, 54) 基準で拡大している。
  Dark / Tinted はscripts/app-icon/generate.shが色を置換して生成する。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#00695F" />

  <g transform="translate(54 54) scale(1.12) translate(-54 -54)" fill="none" stroke="#FFFFFF">
    <!-- ブラウザウィンドウの枠 -->
    <path
      d="M33,32h42a7,7 0 0 1 7,7v30a7,7 0 0 1 -7,7h-42a7,7 0 0 1 -7,-7v-30a7,7 0 0 1 7,-7z"
      stroke-width="5"
      stroke-linejoin="round" />

    <!-- タイトルバーの区切り線 -->
    <path d="M26,45L82,45" stroke-width="4" />

    <!-- タイトルバーのドット -->
    <circle cx="34" cy="38.5" r="2.2" fill="#FFFFFF" stroke="none" />
    <circle cx="42" cy="38.5" r="2.2" fill="#FFFFFF" stroke="none" />

    <!-- JS -> Native -->
    <path d="M37,54L61,54" stroke-width="5" stroke-linecap="round" />
    <path d="M72,54L61,48.5L61,59.5z" fill="#FFFFFF" stroke="none" />

    <!-- Native -> JS -->
    <path d="M71,66L47,66" stroke-width="5" stroke-linecap="round" />
    <path d="M36,66L47,60.5L47,71.5z" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
